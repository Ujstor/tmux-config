# ~/.tmux.conf — github.com/Ujstor/tmux-config
#
# Portable by design. This exact file has to work on WSL, on a Linux desktop
# (X11 or Wayland) and on a headless server reached over SSH, so nothing in it
# may assume a Windows host, an X server or a graphical session at all.
#
# It does have prerequisites, and a fresh box has none of them. install.sh in
# this repo installs them; symlinking this file on its own is NOT enough:
#
#   ~/.tmux/plugins/tpm   without TPM every `set -g @plugin` line near the
#                         bottom is a silent no-op — no catppuccin theme, no
#                         resurrect, no continuum, no yank, no sidebar, no
#                         vim-tmux-navigator. tmux comes up bare and the config
#                         looks broken when it is merely uninstalled.
#   ~/tmux.sh             the layout helper that `bind q` and `bind a` call.
#
# Both are probed below and now say what is missing instead of doing nothing.

unbind r
bind r source-file ~/.tmux.conf

# yazi image passthrough. -q: tmux 3.2a (Ubuntu 22.04) has no such option, and
# an unknown option is a config ERROR there — every new session opened in view
# mode showing "invalid option: allow-passthrough".
set -gq allow-passthrough on

# The appended lists below are reset first. `-ga` APPENDS, so without the reset
# every `prefix r` (and every install.sh run, which reloads) added the same
# entries again and the lists grew for as long as the server lived.
set -gu update-environment
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# DISPLAY is deliberately NOT set here. Do not re-add `set-environment -g DISPLAY :1`.
#
# That line used to live on this spot. It is unconditional, so on a headless box
# every process started inside tmux inherits DISPLAY=:1 and believes it has an X
# server. Everything that "opens a browser" — gh auth login, az login,
# aws sso login, xdg-open, k9s plugins — then hands the URL to a display that
# does not exist and the login silently goes nowhere. On a box that really is
# graphical the correct DISPLAY already arrives from the attaching client, and
# :1 would only overwrite a working value with a wrong one.
#
# Let the client's real values through instead. DISPLAY is already in tmux's
# default update-environment list; WAYLAND_DISPLAY is not.
set -ga update-environment WAYLAND_DISPLAY

set -g default-command "${SHELL}"
set-option -sg escape-time 10
set-option -g focus-events on
# Reset before appending, for the same reason as update-environment above.
set-option -su terminal-features
set-option -sa terminal-features ',screen-256color:RGB'
# set-option -sa terminal-overrides ",xterm*:Tc"
# tmux's own default is "screen" up to 3.4 unless the distro patches it (Debian
# does, Ubuntu 22.04 does not): there every pane got TERM=screen and 8 colours.
set -g default-terminal "tmux-256color"

set -g prefix C-Space
set -g base-index 1
set -g mouse on
# No @shell_mode 'vi': it tells tmux-yank the SHELL is in vi mode, and bash here
# is in emacs mode — prefix + y then typed vi keys into the prompt and copied
# the wrong text. vi keys in COPY mode are the next line, and unaffected.
set-window-option -g mode-keys vi

# ── Clipboard ────────────────────────────────────────────────────────────────
# tmux itself pushes every copy to the OUTER terminal's clipboard with an OSC 52
# escape. That is the only mechanism that survives a plain SSH hop, so keep it on.
# `on` rather than `external` also lets programs INSIDE tmux set the clipboard
# over OSC 52 — which is how nvim's yank reaches your machine over SSH — at the
# price that any output can, the contents of a `cat`ed file included. That is
# why prefix + P below pastes from its own buffer, bracketed, and never falls
# back to the last tmux buffer (which such output also fills).
set -g set-clipboard on
# tmux only emits OSC 52 when terminfo advertises the `Ms` capability, and most
# terminals implement it without advertising it. Declare it, or the OSC 52 path
# above is dead on arrival.
set-option -sa terminal-features ',*:clipboard'

# ONE yank command, resolved at yank time rather than at config-parse time: the
# same file gets attached from Windows Terminal one day and over SSH to a Debian
# VM the next, and a login shell's PATH is not the tmux server's PATH.
#
# Preference order mirrors ~/.local/bin/clip from linux-devops-tools:
# WSL -> Wayland -> X11 -> OSC 52. `clip` / `clip-paste` are used first whenever
# they are installed — they already pick a backend, do the UTF-16LE conversion
# clip.exe needs, and honour a wsl.conf [automount] root other than /mnt.
#
# There is deliberately no bare `clip.exe` or `powershell.exe` anywhere below.
# Those names do not resolve even on this WSL box (the Windows PATH is not on the
# shell's PATH) and cannot exist on a Debian/Ubuntu server at all, which is why
# the old WSL-only binds were dead everywhere. Absolute paths only.
#
# SHAPE. The whole thing is ONE brace group that reads stdin itself, and that is
# load-bearing rather than cosmetic. tmux-yank does not call this command alone:
# it builds `tr -d '\n' | <cmd>` for its yank-without-newline key and
# `<cmd>; tmux paste-buffer -p` for yank-and-put. A bare `d=$(cat); …` sequence
# would put the assignment in the pipeline's subshell for the first of those and
# lose $d in the parent; `{ …; }` keeps every step in the same shell either way.
# For the same reason there is no `exec`, which would replace the shell before
# the appended paste could run.
#
# It ends in a display-message, so EVERY yank path gets the same green flash —
# tmux-yank's y / M-y / !, its MouseDragEnd1Pane, and the fallback binds below.
# That is why the flash lives here and not in a key binding: TPM loads tmux-yank
# at the bottom of this file and it rebinds all of those keys, so a flash bolted
# onto `bind y` would be silently thrown away on a full install.
set -g @clip_copy_command '{ \
  d=$(cat); l="terminal (OSC 52)"; \
  if [ -x "$HOME/.local/bin/clip" ]; then printf %s "$d" | "$HOME/.local/bin/clip"; l=clip; \
  elif command -v clip >/dev/null 2>&1; then printf %s "$d" | clip; l=clip; \
  else \
    w=""; for c in /mnt/c /c; do [ -d "$c/Windows/System32" ] && { w="$c"; break; }; done; \
    if [ -n "$w" ] && [ -x "$w/Windows/System32/clip.exe" ]; then \
      if command -v iconv >/dev/null 2>&1; then \
        printf %s "$d" | iconv -f UTF-8 -t UTF-16LE | "$w/Windows/System32/clip.exe"; \
      else printf %s "$d" | "$w/Windows/System32/clip.exe"; fi; l=windows; \
    elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then printf %s "$d" | wl-copy; l=wayland; \
    elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then printf %s "$d" | xclip -in -selection clipboard; l=x11; \
    elif [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1; then printf %s "$d" | xsel --input --clipboard; l=x11; \
    fi; \
  fi; \
  b=$(printf %s "$d" | wc -c | tr -d " "); \
  n=$(printf %s "$d" | awk "END{print NR}"); \
  tmux display-message -d 800 "#[fg=#1e1e2e,bg=#a6e3a1,bold]  YANK #[fg=#cdd6f4,bg=#313244,nobold] $n ln · $b B · $l #[default]"; \
}'

# And for the copies tmux makes WITHOUT a command of its own: Enter, and double
# and triple click, call copy-pipe-and-cancel with none, which falls back to
# copy-command — unset, so those copies skipped the clipboard and the flash.
set -sF copy-command '#{@clip_copy_command}'

# When no branch above matched, nothing is written anywhere on purpose: nothing
# local can hold a clipboard, and `set-clipboard on` has already sent the
# selection to the terminal on the other end of the SSH session over OSC 52.
# The flash still fires and names OSC 52, so a yank is never silent.

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '#{@clip_copy_command}'

# tmux-yank rebinds copy-mode-vi `y` for itself when TPM loads it at the bottom
# of this file, so its detection — not the bind above — is what actually runs on
# a full install. That detection looks for `clip.exe` BY NAME and then falls
# through to xclip even on a box with no X server, i.e. it fails exactly where it
# matters. @override_copy_command is tmux-yank's documented hook to replace the
# whole chain, and it covers mouse-drag copy too.
#
# tmux-yank reads this option with `tmux show-option -gqv`, which does NOT expand
# formats — it gets the literal `#{@clip_copy_command}` and hands that to
# copy-pipe-and-cancel, which DOES expand it, at yank time. That indirection is
# the point: one definition above, every key below.
#
# (The previous @yank_copy_command / @yank_copy_commands / @yank_paste_command
# lines were removed: tmux-yank has no options by those names, so they never did
# anything at all.)
set -g @override_copy_command '#{@clip_copy_command}'

# prefix + P pastes the SYSTEM clipboard into the pane; tmux's own prefix + ]
# pastes the tmux buffer. There is no OSC 52 read-back — it is write-only by
# design in most terminals — so on a headless box this says so rather than
# appearing to do nothing.
#
# It pastes through its own buffer, bracketed (-p), and deletes it after (-d).
# Loading an EMPTY clipboard creates no buffer, and a bare paste-buffer then
# pasted the newest tmux buffer instead — silently, with each complete line
# running as it arrived. clip-paste failing (no clipboard on a headless box) is
# reported instead of pasting nothing-or-something.
bind P run-shell ' \
  out=""; rc=0; \
  if [ -x "$HOME/.local/bin/clip-paste" ]; then out=$("$HOME/.local/bin/clip-paste" 2>/dev/null) || rc=$?; \
  elif command -v clip-paste >/dev/null 2>&1; then out=$(clip-paste 2>/dev/null) || rc=$?; \
  else \
    w=""; for d in /mnt/c /c; do [ -d "$d/Windows/System32" ] && { w="$d"; break; }; done; \
    ps="$w/Windows/System32/WindowsPowerShell/v1.0/powershell.exe"; \
    if [ -n "$w" ] && [ -x "$ps" ]; then out=$("$ps" -NoProfile -NonInteractive -Command Get-Clipboard | tr -d "\r"); \
    elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-paste >/dev/null 2>&1; then out=$(wl-paste --no-newline 2>/dev/null); \
    elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then out=$(xclip -out -selection clipboard 2>/dev/null); \
    elif [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1; then out=$(xsel --output --clipboard 2>/dev/null); \
    else tmux display-message "no readable clipboard on this host - OSC 52 is write-only, paste with your terminal instead"; exit 0; fi; \
  fi; \
  if [ "$rc" -ne 0 ]; then tmux display-message "no readable clipboard on this host - OSC 52 is write-only, paste with your terminal instead"; exit 0; fi; \
  [ -n "$out" ] || { tmux display-message "the clipboard is empty"; exit 0; }; \
  printf %s "$out" | tmux load-buffer -b sysclip - && tmux paste-buffer -p -d -b sysclip'

# ── Selecting inside a full-screen app (k9s, lazygit, htop, less) ────────────
# THE BUG THIS FIXES. tmux ships this default:
#
#   bind -T root MouseDrag1Pane if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' \
#        'send-keys -M' 'copy-mode -M'
#
# k9s sets BOTH `alternate_on` (it draws on the alternate screen) and
# `mouse_any_flag` (tview turns mouse reporting on), so the condition is true and
# every drag is forwarded to k9s with `send-keys -M`. tmux never enters copy
# mode, so there is nothing to mark and nothing to yank — the keyboard path
# (prefix + [, then v and y) always worked, the mouse one could not.
#
# A MODIFIED drag is a different key as far as tmux is concerned, so it never
# reaches that default and never reaches the application either. Alt and Ctrl are
# both bound because terminals disagree about which one they keep for themselves:
# Windows Terminal takes Alt+drag for block selection, most X11/Wayland terminals
# take neither. Use whichever one your terminal lets through.
#
#   Alt/Ctrl + drag   select inside k9s and friends, then yank on release
#   prefix + m        toggle tmux's mouse off entirely, for the terminal's own
#                     native selection (and back on again)
bind -T root M-MouseDrag1Pane copy-mode -M
bind -T root C-MouseDrag1Pane copy-mode -M
bind -T root M-MouseDown1Pane select-pane -t =
bind -T root C-MouseDown1Pane select-pane -t =

# Once copy mode has started, the drag continues in the copy-mode-vi table, and
# the modifier is still held — so the modified names need binding there too, or
# the release does nothing and the selection is lost.
bind -T copy-mode-vi M-MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi C-MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi M-MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '#{@clip_copy_command}'
bind -T copy-mode-vi C-MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '#{@clip_copy_command}'

# The escape hatch, for a terminal that keeps both modifiers to itself. With
# tmux's mouse off, tmux stops requesting mouse reporting altogether and the
# terminal emulator's own click-and-drag selection works again, everywhere.
bind m set -g mouse \; display-message -d 1000 "mouse: #{?mouse,on — Alt/Ctrl+drag selects in k9s,off — use your terminal's own selection}"

# ── Layout helpers ───────────────────────────────────────────────────────────
# ~/tmux.sh ships with this repo and install.sh puts it there. On a box where the
# config was symlinked by hand it is absent, and these were simply dead keys.
bind q run-shell 'if [ -x "$HOME/tmux.sh" ]; then "$HOME/tmux.sh" -l main-horizontal -p 80; else tmux display-message "~/tmux.sh is missing - run install.sh from github.com/Ujstor/tmux-config"; fi'
bind a run-shell 'if [ -x "$HOME/tmux.sh" ]; then "$HOME/tmux.sh" -l main-vertical -p 60; else tmux display-message "~/tmux.sh is missing - run install.sh from github.com/Ujstor/tmux-config"; fi'

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"
bind x kill-pane

set-option -g status-position top

# List of plugins
# resurrect keys
# prefix + Ctrl-s - save
# prefix + Ctrl-r - restore
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# No @continuum-boot. With it, continuum writes and ENABLES a systemd user unit
# whose ExecStop is `tmux kill-server`: without lingering, systemd stops it ~10 s
# after your last login session ends, taking every session and running job with
# it. It also started a session `0` at each login with DISPLAY=:0 — the fake
# display this file warns about above. (The -options line was macOS-only.) With
# the option gone, continuum disables that unit again on its next start.
# Continuous saving (every 15 min) is continuum's default and is unaffected.

set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @sidebar-tree 'e'
set -g @sidebar-tree-focus 'w'
set -g @sidebar-tree-command 'tree -C'

# Catppuccin v2.x configuration
set -g @catppuccin_flavor 'mocha' # or latte, frappe, macchiato
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

# Window text (updated for v2.x naming)
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# Status line configuration
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
#
# Guarded. With no TPM this used to be a no-op: every @plugin line above did
# nothing, the catppuccin status line above expanded to empty, and tmux came up
# bare. Instead of that, park a warning in the status bar that cannot be missed.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' \
    "run-shell '~/.tmux/plugins/tpm/tpm'" \
    "set -g status-right '#[fg=black,bg=yellow] TPM is not installed: no plugins, no theme. Run install.sh from github.com/Ujstor/tmux-config '"
